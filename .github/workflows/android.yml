# ============================================================================
# CI：构建 + 混淆 + 签名（v1.18.0 新增）
#
# 为什么要有它：v1.17.0 的包是在手机 Termux 里手工构建的，产物里带着
#   META-INF/version-control-info.textproto: generate_error_reason: NO_SUPPORTED_VCS_FOUND
# 也就是说**构建时没有版本控制信息** —— 拿到一个包无法回溯它是从哪个提交出来的。
# 在 CI 里从 git checkout 构建，这个问题自动消失：APK 会带上提交哈希。
#
# 同时它把"混淆 + 正式签名"变成流程的固定环节，不再依赖构建者记得配口令。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   KEYSTORE_BASE64       release.keystore 的 base64（见下方生成命令）
#   KEYSTORE_PASSWORD     storePassword
#   KEY_ALIAS             keyAlias（通常 screentranslator）
#   KEY_PASSWORD          keyPassword
#
# 生成 KEYSTORE_BASE64：
#   base64 -w0 release.keystore        # Linux / macOS
#   base64 -w0 release.keystore        # Termux 同样可用
# ============================================================================
name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # 与 gradle/wrapper/gradle-wrapper.properties 保持一致
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ---- 确保脚本可执行（v1.27.1）----
      #
      # 背景：gradlew 与 scripts/*.sh 在 git 里曾被记录为 100644（无可执行位），
      # Linux runner 上执行 `./gradlew` 直接 Permission denied（exit 126）。
      # 而且这个错**只在 Linux 上暴露** —— Windows 的 NTFS 不理会可执行位，
      # 本地怎么跑都没事，所以能潜伏很久。
      #
      # 根因已用 `git update-index --chmod=+x` 修掉，这一行是第二道保险：
      # 以后新加的 .sh 忘了打权限位，也不会再让整条流水线挂掉。
      - name: Ensure scripts are executable
        run: chmod +x gradlew scripts/*.sh jni/*.sh 2>/dev/null || true

      # ---- 只有拿到密钥的构建（main / tag / 手动）才做正式签名 ----
      - name: Decode signing keystore
        id: signing
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次跳过正式签名（只做构建验证）"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "available=true" >> "$GITHUB_OUTPUT"

      # ---- 正式签名可用 → 出 release（R8 混淆 + v2/v3 签名）----
      - name: Build release (signed, minified)
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew --no-daemon assembleRelease

      # ---- 没有密钥（PR / 未配置）→ 只验证代码能编过，不产 release 包 ----
      # 说明：v1.18.0 起 release 构建缺签名会**直接失败**（这是刻意设计，
      # 防止再次产出 debug 签名的 release 包），所以这里改跑 assembleDebug。
      - name: Build debug (verification only)
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ---- mapping.txt 必须归档，但绝不能公开 ----
      # 它是把线上混淆堆栈还原成可读调用栈的唯一钥匙；同时拿到它等于拿到
      # 完整代码结构。所以：只作为构建产物保存，不进仓库（.gitignore 已排除）。
      - name: Upload R8 mapping (keep private)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Verify signature is NOT the debug key
        if: steps.signing.outputs.available == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "检查 $APK 的签名证书……"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::产物仍是 Android 调试证书签名，拒绝通过"
            exit 1
          fi
          echo "✅ 签名证书不是调试密钥"

      - name: Verify R8 actually obfuscated
        if: steps.signing.outputs.available == 'true'
        run: |
          # v1.27.2：判据重写。
          #
          # 原判据是「自有包名下不应再出现形如 Lcom/.../ui/Xxx; 的类引用」，
          # 这个假设是错的 —— **AndroidManifest 里声明的组件名在 R8 下必然保留**：
          # Activity / Service / Receiver / Application 都靠系统反射实例化，
          # 名字被混淆系统就找不到它们。所以那份名单在正常构建里**一定存在**，
          # 旧判据在任何一次真正跑通的构建上都会失败。
          #
          # （它从 v1.18.0 写下去就一直没被执行过 —— 因为 gradlew 缺可执行位，
          #   流水线每次都早早挂在 exit 126，这条检查根本没机会跑到。
          #   修掉权限位之后，它才第一次显形。）
          #
          # 新判据用 **mapping.txt**，不去猜哪些名字该留、也不定死数字阈值：
          #   ① 保留原名的自有类**只能**是清单组件或 Application。
          #      出现任何别的东西，说明 keep 规则放太宽、逻辑被暴露。
          #   ② 真正含逻辑的包（api / util / overlay）必须一个都不出现在保留名单里。
          #      这一条是实质判据 —— v1.17.0 那种"类名与包结构全原样可见"的包，
          #      api.BaiduTranslator 等一定会在这份名单里，当场被抓。
          #   ③ 被重命名的自有类**数量级**要够（> 100 是宽松下限，实测 439）。
          MAP=app/build/outputs/mapping/release/mapping.txt
          if [ ! -f "$MAP" ]; then
            echo "::error::缺少 $MAP —— 说明 R8 没跑，或 minifyEnabled 被关掉了"
            exit 1
          fi

          # 「映射前后相同」= 保留原名。用 awk 精确按字段切，不用正则猜格式。
          KEPT=$(awk -F' -> ' '/^com\.hunter\.screentranslator\./ { n=$2; sub(/:$/, "", n); if ($1 == n) print $1 }' "$MAP" | sort -u)
          # 「映射前后不同」= 被重命名。与 KEPT 同源，口径一致。
          RENAMED=$(awk -F' -> ' '/^com\.hunter\.screentranslator\./ { n=$2; sub(/:$/, "", n); if ($1 != n) print $1 }' "$MAP" | sort -u | grep -c . || true)
          KEPT_N=$(printf '%s\n' "$KEPT" | grep -c . || true)

          echo "自有类：被重命名 $RENAMED 个，保留原名 $KEPT_N 个"
          echo "--- 保留原名的类（应全部是清单组件）---"
          printf '%s\n' "$KEPT"

          if [ "$RENAMED" -lt 100 ]; then
            echo "::error::只有 $RENAMED 个自有类被重命名（预期 >100），混淆疑似未生效"
            exit 1
          fi

          # 判据 ②：含逻辑的包不得出现在保留名单里
          if printf '%s\n' "$KEPT" | grep -qE '\.(api|util|overlay)\.'; then
            echo "::error::以下含逻辑的类未被混淆，检查 proguard-rules.pro 的 keep 规则："
            printf '%s\n' "$KEPT" | grep -E '\.(api|util|overlay)\.'
            exit 1
          fi

          # 判据 ①：保留名单里不许有"非清单组件"的名字
          BAD=$(printf '%s\n' "$KEPT" | grep -vE '\.(ui|service|receiver)\.[A-Za-z]+$' | grep -v '\.App$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::以下保留原名的类既不是清单组件、也不是 Application："
            printf '%s\n' "$BAD"
            exit 1
          fi

          echo "✅ 混淆已生效（$RENAMED 个类被重命名，保留的 $KEPT_N 个均为清单必需组件）"

      - name: Summary
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "### 构建成功" >> "$GITHUB_STEP_SUMMARY"
            echo "- APK: \`$APK\`（$SIZE）" >> "$GITHUB_STEP_SUMMARY"
            echo "- 提交: \`$GITHUB_SHA\`（已写入 version-control-info）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 仅构建验证（无签名密钥）" >> "$GITHUB_STEP_SUMMARY"
          fi
